name: Build Air-Gap Bundle

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write    # for keyless Sigstore signing
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container
        id: build
        run: |
          docker build -t ml-model:${{ github.sha }} ./examples/e2e-walkthrough/sample-app
          docker save ml-model:${{ github.sha }} -o ml-model.tar
          DIGEST=$(docker inspect ml-model:${{ github.sha }} --format '{{.Id}}')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Compute model artifact hash
        id: model-hash
        run: |
          SHA=$(sha256sum examples/e2e-walkthrough/sample-app/models/model.pkl | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Generate ML-BOM (CycloneDX)
        run: |
          npm install -g @cyclonedx/cdxgen@10
          cdxgen -t python --spec-version 1.6 -o ml-bom.json examples/e2e-walkthrough/sample-app

      - name: Generate ModelBinding manifest
        run: |
          ./transfer-bundler/generate-modelbinding.sh \
            --container-digest "${{ steps.build.outputs.digest }}" \
            --model-sha "${{ steps.model-hash.outputs.sha256 }}" \
            --model-path "/models/model.pkl" \
            --output modelbinding.yaml

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container with Cosign (keyless)
        run: cosign sign --yes ml-model:${{ github.sha }}

      - name: Sign ModelBinding manifest
        run: cosign sign-blob --yes --output-signature modelbinding.yaml.sig modelbinding.yaml

      - name: Bundle all artifacts
        run: |
          ./transfer-bundler/bundle.sh \
            --container ml-model.tar \
            --model examples/e2e-walkthrough/sample-app/models/model.pkl \
            --mlbom ml-bom.json \
            --binding modelbinding.yaml \
            --binding-sig modelbinding.yaml.sig \
            --output airgap-bundle-${{ github.sha }}.tar

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: airgap-bundle
          path: airgap-bundle-${{ github.sha }}.tar
          retention-days: 30
