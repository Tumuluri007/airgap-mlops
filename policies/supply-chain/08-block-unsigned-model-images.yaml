apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-unsigned-model-images
  annotations:
    policies.kyverno.io/title: "Force IfNotPresent ImagePullPolicy and block unsigned ML images"
    policies.kyverno.io/category: "Supply Chain"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/subject: "Pod"
    policies.kyverno.io/description: >-
      Forces ImagePullPolicy to be IfNotPresent for ML images, since the
      registry is local and there is nowhere to pull from anyway. Prevents
      ImagePullPolicy: Always failure mode in disconnected clusters.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: ml-images-must-be-ifnotpresent
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["ml-serving"]
      validate:
        message: >-
          ml-serving images must have ImagePullPolicy: IfNotPresent because
          this cluster has no internet path to pull from. ImagePullPolicy:
          Always would block on every restart.
        pattern:
          spec:
            containers:
              - imagePullPolicy: "IfNotPresent"
            =(initContainers):
              - imagePullPolicy: "IfNotPresent"
