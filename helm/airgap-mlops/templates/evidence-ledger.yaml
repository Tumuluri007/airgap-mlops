apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: airgap-system
  labels:
    {{- include "airgap-mlops.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: registry.airgap.local/grafana/loki:3.0.0
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: storage
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: storage
          persistentVolumeClaim:
            claimName: evidence-ledger-storage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: airgap-system
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: {{ .Values.evidenceLedger.retention | default "90d" | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evidence-ledger-storage
  namespace: airgap-system
  {{- if .Values.evidenceLedger.wormBackend }}
  annotations:
    storage.airgap.mlops/worm: "true"
  {{- end }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.evidenceLedger.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: airgap-system
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
