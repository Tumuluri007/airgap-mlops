{{- if .Values.mlflow.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml-serving
  labels:
    {{- include "airgap-mlops.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: registry.airgap.local/mlflow:2.15.0
          args:
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=postgresql://mlflow:mlflow@mlflow-postgres:5432/mlflow
            - --artifacts-destination=/var/lib/mlflow/artifacts
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/mlflow/artifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
  namespace: ml-serving
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.mlflow.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ml-serving
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
{{- end }}
